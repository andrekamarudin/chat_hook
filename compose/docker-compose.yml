services:
  chat-hook:
    build:
      context: ${CHAT_HOOK_SRC:-..}
      dockerfile: Dockerfile
    image: chat-hook:local
    container_name: chat-hook
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Singapore}
      CHAT_HOOK_DB: /data/events.sqlite3
      CHAT_HOOK_PUBLIC_URL: ${CHAT_HOOK_PUBLIC_URL:-https://hooks.bytesizeprotip.com}
    expose:
      - "8080"
    volumes:
      - chat-hook-data:/data
    networks:
      - default
      - caddy-net
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8080/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  chat-hook-worker:
    image: chat-hook:local
    pull_policy: never
    container_name: chat-hook-worker
    command: ["python", "-m", "chat_hook.worker"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Singapore}
      CHAT_HOOK_DB: /data/events.sqlite3
      CHAT_HOOK_PUBLIC_URL: ${CHAT_HOOK_PUBLIC_URL:-https://hooks.bytesizeprotip.com}
    volumes:
      - chat-hook-data:/data
    networks:
      - default
    depends_on:
      chat-hook:
        condition: service_healthy
networks:
  caddy-net:
    external: true
volumes:
  chat-hook-data:
    name: chat-hook-data
